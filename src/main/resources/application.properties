spring.application.name=blog-backend

# 注意：这里用 3307，因为 3306 被 Docker 容器 customer-service-mysql 占用
# phpStudy 的 MySQL 已改到 3307（见 E:\phpstudy_pro\Extensions\MySQL8.0.12\my.ini）
spring.datasource.url=jdbc:mysql://localhost:3307/blog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true


# ===== Redis 缓存配置（博客项目专用实例）=====
# 宿主机端口 6380（容器内部仍是 6379），有密码，见 Docker 容器 blog-redis
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.password=blog123456
spring.data.redis.database=0

# 连接超时：命令发出后最多等 3 秒，超时即失败（避免请求被无限拖住）
spring.data.redis.timeout=3000ms

# 连接池（Lettuce 是 Spring Boot 默认的 Redis 客户端）
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
# ===== 端口配置 =====
# 不要用 8080 / 8081：它们落在 Windows 的 TCP 保留端口范围内
# （netsh interface ipv4 show excludedportrange protocol=tcp 里能看到 7957~8156 被排除）
# 这是 Hyper-V / WSL2 / Docker Desktop 启动时申请动态端口造成的，
# 表现是"明明没程序占用，却报 Port xxxx was already in use"
# 18080 在保留范围之外，实测可正常绑定
server.port=18080
