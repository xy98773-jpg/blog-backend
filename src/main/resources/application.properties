spring.application.name=blog-backend

# ============================================================
# 配置读取顺序：环境变量 > 这里的默认值
#
# 语法 ${ENV_VAR:默认值} 的含义：
#   「有环境变量 ENV_VAR 就用它，没有就用冒号后面的默认值」
#
# 为什么这样写？
#   · 本地 IDEA 里跑：没有环境变量 → 用默认值（localhost:3307）
#   · Docker 里跑   ：compose 传 SPRING_DATASOURCE_URL=mysql:3306 → 用服务名寻址
#   · 云服务器部署  ：在平台的环境变量里配置 → 【不用改代码、不用重新打包】
#   · 公开仓库时    ：代码里没有真实密码，安全
# ============================================================

# ===== 数据库配置 =====
# 本地默认端口 3307：因为 3306 被 Docker 容器 customer-service-mysql 占用
# （phpStudy 的 MySQL 已改到 3307，见 E:\phpstudy_pro\Extensions\MySQL8.0.12\my.ini）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/blog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true


# ===== Redis 缓存配置（博客项目专用实例）=====
# 本地默认：宿主机端口 6380（容器内部仍是 6379），有密码，见 Docker 容器 blog-redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6380}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:blog123456}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}

# 连接超时：命令发出后最多等 3 秒，超时即失败（避免请求被无限拖住）
spring.data.redis.timeout=3000ms

# 连接池（Lettuce 是 Spring Boot 默认的 Redis 客户端）
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0


# ===== JWT 配置 =====
# ⚠️ 安全要点：密钥绝不能写死在代码里（一旦泄露，任何人都能伪造出合法 Token）
#   这里的默认值【仅供本地开发】，生产环境必须通过环境变量 JWT_SECRET 覆盖！
#   要求：至少 32 字节（代码里会做长度校验，太短直接启动失败）
#
#   生成一个随机密钥（PowerShell 一行命令）：
#     -join ((1..64) | ForEach-Object { '{0:x}' -f (Get-Random -Max 16) })
jwt.secret=${JWT_SECRET:xujinzhou-blog-dev-only-secret-key-please-change-in-prod-2026}
# Token 有效期：24 小时 = 86400000 毫秒
jwt.expire-millis=86400000


# ===== 服务端口 =====
# 不要用 8080 / 8081：它们落在 Windows 的 TCP 保留端口范围内
# （netsh interface ipv4 show excludedportrange protocol=tcp 里能看到 7957~8156 被排除）
# 这是 Hyper-V / WSL2 / Docker Desktop 启动时申请动态端口造成的，
# 表现是"明明没程序占用，却报 Port xxxx was already in use"
# 18080 在保留范围之外，实测可正常绑定
server.port=${SERVER_PORT:18080}